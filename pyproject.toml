[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "decision-forge"
version = "0.3.0"
description = "Compile organizational policy into verifiable decision training data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Decision Forge contributors" }]
keywords = [
  "decision-data",
  "policy-as-code",
  "synthetic-data",
  "data-provenance",
  "fine-tuning",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "filelock>=3.17,<5",
]

[project.urls]
Homepage = "https://github.com/Juneo-Lab/decision-forge"
Documentation = "https://juneo-lab.github.io/decision-forge/"
Repository = "https://github.com/Juneo-Lab/decision-forge"
Issues = "https://github.com/Juneo-Lab/decision-forge/issues"
Changelog = "https://github.com/Juneo-Lab/decision-forge/blob/main/CHANGELOG.md"

[project.scripts]
decision-forge = "decision_forge.cli:app"

[project.optional-dependencies]
documents = [
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "beautifulsoup4>=4.13,<5",
]
ocr = [
    "Pillow>=11,<13",
    "pypdfium2>=4.30,<6",
]
ocr-rapid = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2",
    "Pillow>=11,<13",
    "pypdfium2>=4.30,<6",
]
orchestration = [
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
]
designer = [
    "data-designer==0.9.7",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-PyYAML>=6", "build>=1.2,<2"]
docs = ["mkdocs-material>=9.6,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
