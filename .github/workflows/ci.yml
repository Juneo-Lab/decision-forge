name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra documents --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run mkdocs build --strict
      - run: uv build
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra documents --extra ocr --python ${{ matrix.python }}
      - run: uv run pytest --cov=decision_forge --cov-report=term-missing --cov-fail-under=80
      - run: uv run decision-forge build examples/customer_support/project.yaml --output runs/ci --locked-splits
      - run: uv run decision-forge export runs/ci --output runs/ci-export --format typed
      - run: uv run decision-forge export runs/ci --output runs/ci-decisions --format decision

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra designer --extra orchestration --python 3.12
      - run: uv run --no-sync pytest tests/test_adapters.py

  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra documents --extra ocr-rapid --python 3.12
      - run: uv run --no-sync pytest tests/test_sources.py tests/test_document_formats.py tests/test_ocr.py
      - run: uv run --no-sync python scripts/create_document_fixtures.py --output runs/document-fixtures
      - run: uv run --no-sync decision-forge ingest runs/document-fixtures/corpus.yaml --output runs/documents.json

  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev --python 3.12
      - run: uv tool install 'harbor==0.25.0' --python 3.12
      - run: uv run --no-sync decision-forge build examples/customer_support/project.yaml --output runs/harbor-build
      - run: uv run --no-sync decision-forge harbor-export runs/harbor-build --output runs/harbor-tasks --limit 8
      - run: harbor run -p runs/harbor-tasks -a oracle -e docker --jobs-dir runs/harbor-oracle -n 2
      - run: uv run --no-sync python scripts/check_harbor_results.py --manifest runs/harbor-tasks/manifest.json --jobs runs/harbor-oracle --agent oracle --reward 1
      - run: harbor run -p runs/harbor-tasks -a nop -e docker --jobs-dir runs/harbor-nop -n 2
      - run: uv run --no-sync python scripts/check_harbor_results.py --manifest runs/harbor-tasks/manifest.json --jobs runs/harbor-nop --agent nop --reward 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-controls
          path: |
            runs/harbor-tasks/manifest.json
            runs/harbor-oracle
            runs/harbor-nop

  # Requires the repository's dependency graph (Settings -> Code security). Enable the graph, then set the
  # Actions repository variable DEPENDENCY_REVIEW to 'true' to turn this check on.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # Single stable status for branch protection: require "CI result" instead of every matrix entry.
  result:
    name: CI result
    if: always()
    needs: [quality, test, adapters, ocr, harbor, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded or was intentionally skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
