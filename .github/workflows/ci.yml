name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra documents --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run mkdocs build --strict
      - run: uv build
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra documents --python ${{ matrix.python }}
      - run: uv run pytest --cov=decision_forge --cov-report=term-missing --cov-fail-under=80
      - run: uv run decision-forge build examples/customer_support/project.yaml --output runs/ci
      - run: uv run decision-forge export runs/ci --output runs/ci-export --format typed

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra designer --extra orchestration --python 3.12
      - run: uv run --no-sync pytest tests/test_adapters.py
