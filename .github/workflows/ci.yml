name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra documents --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run mkdocs build --strict
      - run: uv build
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra documents --python ${{ matrix.python }}
      - run: uv run pytest --cov=decision_forge --cov-report=term-missing --cov-fail-under=80
      - run: uv run decision-forge build examples/customer_support/project.yaml --output runs/ci
      - run: uv run decision-forge export runs/ci --output runs/ci-export --format typed

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra designer --extra orchestration --python 3.12
      - run: uv run --no-sync pytest tests/test_adapters.py

  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev --python 3.12
      - run: uv tool install 'harbor==0.25.0' --python 3.12
      - run: uv run --no-sync decision-forge build examples/customer_support/project.yaml --output runs/harbor-build
      - run: uv run --no-sync decision-forge harbor-export runs/harbor-build --output runs/harbor-tasks --limit 8
      - run: harbor run -p runs/harbor-tasks -a oracle -e docker --jobs-dir runs/harbor-oracle -n 2
      - run: uv run --no-sync python scripts/check_harbor_results.py --manifest runs/harbor-tasks/manifest.json --jobs runs/harbor-oracle --agent oracle --reward 1
      - run: harbor run -p runs/harbor-tasks -a nop -e docker --jobs-dir runs/harbor-nop -n 2
      - run: uv run --no-sync python scripts/check_harbor_results.py --manifest runs/harbor-tasks/manifest.json --jobs runs/harbor-nop --agent nop --reward 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-controls
          path: |
            runs/harbor-tasks/manifest.json
            runs/harbor-oracle
            runs/harbor-nop
