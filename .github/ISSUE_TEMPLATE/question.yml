name: Question
description: Ask about commands, reports, or integration contracts.
title: "[Question]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question and intended workflow
      description: Use fictional examples; exclude credentials and private documents.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version, command, and relevant output
    validations:
      required: true
