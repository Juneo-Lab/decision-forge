name: Feature proposal
description: Propose an adapter, workflow, verifier, or platform capability.
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: User problem and workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, provenance, and evaluation considerations
